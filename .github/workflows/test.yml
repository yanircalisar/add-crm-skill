name: test
on:
  push:
  pull_request:
jobs:
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/add-crm/templates/base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
